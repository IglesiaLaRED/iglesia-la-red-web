<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrativo | Iglesia La RED</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen text-gray-800">

  <header class="bg-slate-950 text-white py-6 shadow-xl">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold">Panel Administrativo</h1>
      <a href="index.html" class="bg-cyan-500 px-5 py-2 rounded-full font-bold">
        Volver al sitio
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12">

    <section class="bg-white rounded-3xl shadow-xl p-8 text-center">
      <h2 class="text-4xl font-bold text-cyan-800">
        Bienvenido al Panel
      </h2>

      <p class="mt-4 text-gray-600">
        Desde aquí administraremos Barcas, eventos, enlaces y contenido de Iglesia La RED.
      </p>

      <div class="mt-10 grid md:grid-cols-3 gap-6">

        <div class="bg-cyan-50 rounded-2xl p-6 shadow">
          <h3 class="text-xl font-bold text-cyan-800">🚣 Barcas</h3>
          <p class="mt-3 text-gray-600">Agregar, editar y actualizar Barcas.</p>
        </div>

        <div class="bg-pink-50 rounded-2xl p-6 shadow">
          <h3 class="text-xl font-bold text-pink-700">📝 Encuentros</h3>
          <p class="mt-3 text-gray-600">Administrar enlaces de formularios.</p>
        </div>

        <div class="bg-indigo-50 rounded-2xl p-6 shadow">
          <h3 class="text-xl font-bold text-indigo-700">📻 Radio</h3>
          <p class="mt-3 text-gray-600">Actualizar información de radio.</p>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
