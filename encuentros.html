<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encuentros | RED Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

  <body class="bg-slate-100 text-slate-800">

  <main class="max-w-7xl mx-auto px-4 py-8">

    <header class="mb-8">
      <p class="text-sm font-bold text-blue-700">🦁 RED Nexus</p>
      <h1 class="text-3xl font-extrabold text-slate-900">👨🏻‍🦱 y 👩🏻‍🦰 Encuentros</h1>
      <p class="text-slate-500">Dashboard ejecutivo de inscripciones</p>
    </header>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

      <div class="bg-white rounded-2xl shadow p-6 border-l-4 border-blue-600">
        <h2 class="text-xl font-bold text-blue-900">👨 Encuentro de Hombres</h2>
        <p class="text-5xl font-extrabold mt-4" id="totalHombres">0</p>
        <p class="text-slate-500">inscritos</p>

        <div class="grid grid-cols-3 gap-3 mt-5 text-center">
          <div class="bg-blue-50 rounded-xl p-3">
            <p class="text-xl font-extrabold" id="hombresHoy">0</p>
            <p class="text-xl text-slate-500">Hoy</p>
          </div>
          <div class="bg-blue-50 rounded-xl p-3">
            <p class="text-xl font-extrabold" id="hombresSemana">0</p>
            <p class="text-xl text-slate-500">Semana</p>
          </div>
          <div class="bg-blue-50 rounded-xl p-3">
            <p class="text-xl font-extrabold" id="ultimoHombre">—</p>
            <p class="text-xl text-slate-500">Último</p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow p-6 border-l-4 border-pink-500">
        <h2 class="text-xl font-bold text-pink-900">👩 Encuentro de Mujeres</h2>
        <p class="text-5xl font-extrabold mt-4" id="totalMujeres">0</p>
        <p class="text-slate-500">inscritas</p>

        <div class="grid grid-cols-3 gap-3 mt-5 text-center">
          <div class="bg-pink-50 rounded-xl p-3">
            <p class="text-xl font-extrabold" id="mujeresHoy">0</p>
            <p class="text-xl text-slate-500">Hoy</p>
          </div>
          <div class="bg-pink-50 rounded-xl p-3">
            <p class="text-xl font-extrabold" id="mujeresSemana">0</p>
            <p class="text-xl text-slate-500">Semana</p>
          </div>
          <div class="bg-pink-50 rounded-xl p-3">
            <p class="text-xl font-extrabold" id="ultimaMujer">—</p>
            <p class="text-xl text-slate-500">Última</p>
          </div>
        </div>
      </div>

    </section>

    <section class="bg-white rounded-2xl shadow p-6">
     <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-5">

    <h2 class="text-xl font-bold text-slate-900">
        📋 Listado de inscritos
    </h2>

    <div class="flex flex-wrap items-center gap-3">

        <button onclick="cambiarFiltro('todos')"
            class="px-4 py-2 rounded-xl bg-slate-900 text-white">
            Todos
        </button>

        <button onclick="cambiarFiltro('hombres')"
            class="px-4 py-2 rounded-xl bg-blue-600 text-white">
            Hombres
        </button>

        <button onclick="cambiarFiltro('mujeres')"
            class="px-4 py-2 rounded-xl bg-pink-500 text-white">
            Mujeres
        </button>

        <input
            id="buscador"
            type="text"
            placeholder="🔍 Buscar nombre, teléfono..."
            class="w-80 border rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button onclick="RNExportarExcel()"
            class="px-3 py-2 rounded-xl bg-green-600 text-white">
            📥 Excel
        </button>

        <button onclick="RNExportarPDF()"
            class="px-3 py-2 rounded-xl bg-red-600 text-white">
            📄 PDF
        </button>

    </div>

</div>
     
      <div id="tablaInscritos" class="overflow-x-auto"></div>
    </section>

  </main>

  <script>
    const URL_ENCUENTROS = "https://script.google.com/macros/s/AKfycbzDV7LO1kBO5XUsOtCTfOMl2xxgJc-rIRCb_D1IDGXjcKWXtPMQJwWsiDROmdg0fixDvw/exec";

    let datosHombres = [];
    let datosMujeres = [];
    let filtroActual = "todos";

    async function cargarEncuentros() {
      try {
        const respuesta = await fetch(URL_ENCUENTROS, {
  method: "GET",
  cache: "no-store"
});

if (!respuesta.ok) {
  throw new Error(`Error HTTP ${respuesta.status}`);
}

const texto = await respuesta.text();

if (texto.trim().startsWith("<")) {
  throw new Error("La URL devolvió HTML, no JSON. Revisa la URL de Apps Script.");
}

const data = JSON.parse(texto);

        datosHombres = data.hombres || [];
        datosMujeres = data.mujeres || [];

        actualizarDashboard();
        renderizarTabla();

      } catch (error) {
        if (datosHombres.length === 0 && datosMujeres.length === 0) {
  document.getElementById("tablaInscritos").innerHTML =
    `<p class="text-red-600">No se pudieron cargar los datos.</p>`;
} else {
  console.warn("No se pudo actualizar, se conservan los datos cargados.");
}
    }
      }

    function actualizarDashboard() {
      document.getElementById("totalHombres").textContent = datosHombres.length;
      document.getElementById("totalMujeres").textContent = datosMujeres.length;

      document.getElementById("hombresHoy").textContent = contarHoy(datosHombres);
      document.getElementById("mujeresHoy").textContent = contarHoy(datosMujeres);

      document.getElementById("hombresSemana").textContent = contarSemana(datosHombres);
      document.getElementById("mujeresSemana").textContent = contarSemana(datosMujeres);

      document.getElementById("ultimoHombre").textContent = obtenerUltimoNombre(datosHombres);
      document.getElementById("ultimaMujer").textContent = obtenerUltimoNombre(datosMujeres);
    }

    function renderizarTabla() {
      const busqueda = document.getElementById("buscador").value.toLowerCase();

      let datos = [];

      if (filtroActual === "hombres" || filtroActual === "todos") {
        datos = datos.concat(datosHombres.map(item => ({ ...item, tipo: "Hombres" })));
      }

      if (filtroActual === "mujeres" || filtroActual === "todos") {
        datos = datos.concat(datosMujeres.map(item => ({ ...item, tipo: "Mujeres" })));
      }

      datos = datos.filter(item => {
        const texto = JSON.stringify(item).toLowerCase();
        return texto.includes(busqueda);
      });

      if (datos.length === 0) {
        document.getElementById("tablaInscritos").innerHTML =
          `<p class="text-slate-500">No hay registros para mostrar.</p>`;
        return;
      }

      let html = `
        <table class="min-w-full border border-slate-200 rounded-xl overflow-hidden">
          <thead class="bg-slate-900 text-white">
            <tr>
<th class="px-4 py-3 text-left text-sm">Tipo</th>
<th class="px-4 py-3 text-left text-sm">Nombre</th>
<th class="px-4 py-3 text-left text-sm">Edad</th>
<th class="px-4 py-3 text-left text-sm">Estado Civil</th>
<th class="px-4 py-3 text-left text-sm">Teléfono</th>
<th class="px-4 py-3 text-left text-sm">Correo</th>
<th class="px-4 py-3 text-left text-sm">Fecha</th>
            </tr>
          </thead>
          <tbody>
      `;

      datos.forEach(item => {
        html += `
          <tr class="border-t hover:bg-slate-50">
       <td class="px-4 py-3 text-sm font-bold">${item.tipo}</td>
<td class="px-4 py-3 text-sm font-semibold">
  ${normalizarNombre(item["NOMBRE COMPLETO:"])}
</td>
<td class="px-4 py-3 text-sm">${item["EDAD:"] || ""}</td>
<td class="px-4 py-3 text-sm">${item["ESTADO CIVIL:"] || ""}</td>
<td class="px-4 py-3 text-sm">${item["NUMERO DE TELÉFONO:"] || ""}</td>
<td class="px-4 py-3 text-sm">${item["CORREO ELECTRONICO:"] || ""}</td>
<td class="px-4 py-3 text-sm">${formatearFecha(item["Marca temporal"])}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;

      document.getElementById("tablaInscritos").innerHTML = html;
    }

    function cambiarFiltro(filtro) {
      filtroActual = filtro;
      renderizarTabla();
    }

    function obtenerUltimoNombre(datos) {
      if (!datos.length) return "—";
      const ultimo = datos[datos.length - 1];
      return normalizarNombre(ultimo["NOMBRE COMPLETO:"]) || "—";
    }

    function contarHoy(datos) {
      const hoy = new Date().toDateString();

      return datos.filter(item => {
        const fecha = new Date(item["Marca temporal"]);
        return fecha.toDateString() === hoy;
      }).length;
    }

    function contarSemana(datos) {
      const ahora = new Date();
      const hace7Dias = new Date();
      hace7Dias.setDate(ahora.getDate() - 7);

      return datos.filter(item => {
        const fecha = new Date(item["Marca temporal"]);
        return fecha >= hace7Dias && fecha <= ahora;
      }).length;
    }

    function formatearFecha(valor) {
      if (!valor) return "";
      const fecha = new Date(valor);

      if (isNaN(fecha)) return valor;

      return fecha.toLocaleDateString("es-SV", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    document.getElementById("buscador").addEventListener("input", renderizarTabla);

    cargarEncuentros();
    setInterval(cargarEncuentros, 60000);
    window.RNExportarExcel = RNExportarExcel;
    window.RNExportarPDF = RNExportarPDF;

function normalizarNombre(nombre) {
  if (!nombre) return "";

  const conectores = ["de", "del", "la", "las", "los", "y"];

  return nombre
    .toString()
    .trim()
    .toLowerCase()
    .split(" ")
    .filter(palabra => palabra !== "")
    .map((palabra, index) => {
      if (index !== 0 && conectores.includes(palabra)) {
        return palabra;
      }

      return palabra.charAt(0).toUpperCase() + palabra.slice(1);
    })
    .join(" ");
}

function obtenerDatosFiltradosParaExportar() {
  let datos = [];

  if (filtroActual === "hombres" || filtroActual === "todos") {
    datos = datos.concat(datosHombres.map(item => ({ ...item, tipo: "Hombres" })));
  }

  if (filtroActual === "mujeres" || filtroActual === "todos") {
    datos = datos.concat(datosMujeres.map(item => ({ ...item, tipo: "Mujeres" })));
  }

  return datos.map(item => ({
  Tipo: item.tipo,
  Nombre: normalizarNombre(item["NOMBRE COMPLETO:"]),
  Edad: item["EDAD:"] || "",
  EstadoCivil: item["ESTADO CIVIL:"] || "",
  Telefono: item["NUMERO DE TELÉFONO:"] || "",
  Correo: item["CORREO ELECTRONICO:"] || "",
  FechaInscripcion: formatearFecha(item["Marca temporal"])
}));
}

function obtenerTituloExportacion() {
  if (filtroActual === "hombres") return "Encuentro de Hombres Julio 2026";
  if (filtroActual === "mujeres") return "Encuentro de Mujeres Julio 2026";
  return "Encuentros Julio 2026";
}

function obtenerNombreArchivo(base, extension) {
  const tipo = filtroActual === "hombres"
    ? "Hombres"
    : filtroActual === "mujeres"
      ? "Mujeres"
      : "Todos";

  return `${base}_${tipo}_Julio_2026.${extension}`;
}

function RNExportarExcel() {
  const datos = obtenerDatosFiltradosParaExportar();

  if (datos.length === 0) {
    alert("No hay datos para exportar.");
    return;
  }

  const resumen = [
    ["🦁 RED Nexus", ""],
    ["Sistema Integral Iglesia La RED", ""],
    ["Encuentro", obtenerTituloExportacion()],
    ["Total registros", datos.length],
    ["Generado", new Date().toLocaleString("es-SV")]
  ];

  const hojaResumen = XLSX.utils.aoa_to_sheet(resumen);
  const datosExcel = datos.map(item => ({
  "Tipo": item.Tipo,
  "Nombre": item.Nombre,
  "Edad": item.Edad,
  "Estado Civil": item.EstadoCivil,
  "Teléfono": item.Telefono,
  "Correo": item.Correo,
  "Fecha Inscripción": item.FechaInscripcion
}));

const hojaListado = XLSX.utils.json_to_sheet(datosExcel);

  const libro = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(libro, hojaListado, "Listado");
  XLSX.utils.book_append_sheet(libro, hojaResumen, "Resumen");
 

  XLSX.writeFile(libro, obtenerNombreArchivo("Encuentro", "xlsx"));
}

function RNExportarPDF() {
  const datos = obtenerDatosFiltradosParaExportar();

  if (datos.length === 0) {
    alert("No hay datos para exportar.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("landscape");

  doc.setFontSize(16);
  doc.text("RED Nexus",14,15);

  doc.setFontSize(11);
  doc.text("Sistema Integral Iglesia La RED",14,22);

  doc.setFontSize(14);
  doc.text(obtenerTituloExportacion(), 14, 34);

  doc.setFontSize(10);
  doc.text(`Total registros: ${datos.length}`, 14, 42);
  doc.text(`Generado: ${new Date().toLocaleString("es-SV")}`, 14, 48);

  doc.autoTable({
    startY: 56,
    head: [[
"Tipo",
"Nombre",
"Edad",
"Estado Civil",
"Teléfono",
"Correo",
"Fecha"
]],
    body: datos.map(item => [
      item.Tipo,
item.Nombre,
item.Edad,
item.EstadoCivil,
item.Telefono,
item.Correo,
item.FechaInscripcion
    ]),
    styles: { fontSize: 8 },
    headStyles: { fillColor: [15, 23, 42] }
  });

  doc.save(obtenerNombreArchivo("Encuentro", "pdf"));
}
    
  </script>

</body>
</html>
