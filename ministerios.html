<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ministerios | Iglesia La RED</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

  <header class="bg-slate-900 border-b border-white/10 px-6 py-5 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-extrabold">IGLESIA LA RED</h1>
      <p class="text-sm text-cyan-300">Área de Miembros · Ministerios</p>
    </div>

    <a
      href="miembros.html"
      class="bg-cyan-600 hover:bg-cyan-700 px-5 py-3 rounded-xl font-bold transition">
      ← Volver
    </a>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">

    <section class="mb-8">
      <h2 class="text-4xl font-extrabold mb-3">
        👥 Listado de Ministerios y Servidores
      </h2>

      <p class="text-slate-300">
        Consulta general de servidores registrados en Iglesia La RED.
      </p>
    </section>

    <section class="bg-slate-900 rounded-3xl shadow-2xl p-6 border border-white/10">

      <div class="flex flex-col md:flex-row gap-4 md:items-center md:justify-between mb-6">
        <input
          id="busqueda"
          type="text"
          placeholder="Buscar por nombre, ministerio, cargo o teléfono..."
          class="w-full md:w-1/2 px-5 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-4 focus:ring-cyan-600"
        />

<select
  id="filtroMinisterio"
  class="w-full md:w-1/3 px-5 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-4 focus:ring-cyan-600">

  <option value="">Todos los ministerios</option>

</select>

        <button
  id="btnExcel"
  class="bg-green-600 hover:bg-green-700 px-5 py-3 rounded-xl font-bold transition">

  📊 Exportar Excel

</button>

        <button
  id="btnPDF"
  class="bg-red-600 hover:bg-red-700 px-5 py-3 rounded-xl font-bold transition">

  📄 Exportar PDF

</button>
        
        <p id="contador" class="text-cyan-300 font-bold">
          Cargando servidores...
        </p>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800 text-cyan-300">
              <th class="p-4">Ministerio</th>
<th class="p-4">Nombre</th>
<th class="p-4">Cargo</th>
<th class="p-4">Teléfono</th>
<th class="p-4">Academia</th>
<th class="p-4">Otro ministerio</th>
<th class="p-4">Estado</th>
            </tr>
          </thead>

          <tbody id="tablaServidores">
            <tr>
              <td colspan="7" class="p-6 text-center text-slate-400">
                Cargando información...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyAmD5LVjdETks7pD8hyqAFXuvSZMmstDrI",
      authDomain: "iglesia-la-red.firebaseapp.com",
      projectId: "iglesia-la-red",
      storageBucket: "iglesia-la-red.firebasestorage.app",
      messagingSenderId: "691049458169",
      appId: "1:691049458169:web:4f5d82e28a1de5d0b47528"
    };

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);
const auth = getAuth(app);
    
    const tabla = document.getElementById("tablaServidores");
    const contador = document.getElementById("contador");
    const busqueda = document.getElementById("busqueda");
const filtroMinisterio = document.getElementById("filtroMinisterio");
    const btnExcel = document.getElementById("btnExcel");
const btnPDF = document.getElementById("btnPDF");
    
    let servidores = [];

    async function cargarServidores() {
      try {
        const resultado = await getDocs(collection(db, "servidores"));

        servidores = [];

        resultado.forEach((documento) => {
          servidores.push(documento.data());
        });

        servidores.sort((a, b) => {
          const ministerioA = a.ministerioPrincipal || "";
          const ministerioB = b.ministerioPrincipal || "";

          if (ministerioA !== ministerioB) {
            return ministerioA.localeCompare(ministerioB);
          }

          return (a.nombre || "").localeCompare(b.nombre || "");
        });

        cargarFiltroMinisterios();
        pintarServidores(servidores);

      } catch (error) {
        console.error("Error cargando servidores:", error);

        tabla.innerHTML = `
          <tr>
            <td colspan="7" class="p-6 text-center text-red-400">
              Error al cargar servidores.
            </td>
          </tr>
        `;

        contador.textContent = "Error de carga";
      }
    }

    function pintarServidores(lista) {
      if (lista.length === 0) {
        tabla.innerHTML = `
          <tr>
            <td colspan="7" class="p-6 text-center text-slate-400">
              No hay servidores registrados.
            </td>
          </tr>
        `;

        contador.textContent = "0 servidores";
        return;
      }

      let html = "";

      lista.forEach((servidor) => {
        const estado = servidor.estado || "Sin estado";

        html += `
          <tr class="border-b border-slate-800 hover:bg-slate-800/70 transition">
            <td class="p-4 font-semibold text-white">
              ${servidor.ministerioPrincipal || "Sin ministerio"}
            </td>

            <td class="p-4">
              ${servidor.nombre || "Sin nombre"}
            </td>

            <td class="p-4 text-slate-300">
              ${servidor.cargo || "Sin cargo"}
            </td>

           <td class="p-4 text-slate-300 whitespace-nowrap">
  ${servidor.telefono || "Sin teléfono"}
</td>

            <td class="p-4 text-slate-300">
              ${servidor.academia || "Pendiente"}
            </td>

<td class="p-4 text-slate-300 max-w-[250px]">
  ${servidor.otrosMinisterios || "No"}
</td>

            <td class="p-4">
              <span class="px-3 py-1 rounded-full text-sm font-bold ${
                estado.toLowerCase() === "activo"
                  ? "bg-green-500/20 text-green-300"
                  : "bg-yellow-500/20 text-yellow-300"
              }">
                ${estado}
              </span>
            </td>
          </tr>
        `;
      });

      tabla.innerHTML = html;
      contador.textContent = `${lista.length} servidores`;
    }

function cargarFiltroMinisterios() {
  const ministeriosUnicos = [
    ...new Set(
      servidores
        .map((servidor) => servidor.ministerioPrincipal || "Sin ministerio")
        .filter((ministerio) => ministerio.trim() !== "")
    )
  ].sort();

  let opciones = `<option value="">Todos los ministerios</option>`;

  ministeriosUnicos.forEach((ministerio) => {
    opciones += `
      <option value="${ministerio}">
        ${ministerio}
      </option>
    `;
  });

  filtroMinisterio.innerHTML = opciones;
}

function obtenerServidoresFiltrados() {
  const texto = busqueda.value.toLowerCase().trim();
  const ministerioSeleccionado = filtroMinisterio.value;

  return servidores.filter((servidor) => {
    const coincideTexto = `
      ${servidor.ministerioPrincipal || ""}
      ${servidor.nombre || ""}
      ${servidor.cargo || ""}
      ${servidor.telefono || ""}
      ${servidor.academia || ""}
      ${servidor.otrosMinisterios || ""}
      ${servidor.estado || ""}
    `.toLowerCase().includes(texto);

    const coincideMinisterio =
      ministerioSeleccionado === "" ||
      servidor.ministerioPrincipal === ministerioSeleccionado;

    return coincideTexto && coincideMinisterio;
  });
}

function aplicarFiltros() {
  const filtrados = obtenerServidoresFiltrados();
  pintarServidores(filtrados);
}

btnExcel.addEventListener("click", async () => {

  const datos = obtenerServidoresFiltrados();

  const workbook = new ExcelJS.Workbook();
  const worksheet = workbook.addWorksheet("Servidores");

  const fecha = new Date().toLocaleDateString("es-SV", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

  const fechaArchivo = new Date()
    .toISOString()
    .split("T")[0];

  const ministerioSeleccionado =
    filtroMinisterio.value || "Todos los ministerios";

  const respuestaLogo = await fetch("logo-red-oficial.png");
  const logoBlob = await respuestaLogo.blob();
  const logoBuffer = await logoBlob.arrayBuffer();

  const logoId = workbook.addImage({
    buffer: logoBuffer,
    extension: "png"
  });

  worksheet.addImage(logoId, {
    tl: { col: 0, row: 0 },
    ext: { width: 180, height: 80 }
  });

  worksheet.mergeCells("C1:G1");
  worksheet.getCell("C1").value = "IGLESIA LA RED";
  worksheet.getCell("C1").font = {
    size: 22,
    bold: true,
    color: { argb: "FF1E40AF" }
  };

  worksheet.mergeCells("C2:G2");
  worksheet.getCell("C2").value =
    "Listado de Ministerios y Servidores";

  worksheet.getCell("C2").font = {
    size: 14,
    bold: true
  };

  worksheet.mergeCells("C3:G3");

  worksheet.getCell("C3").value =
    `Fecha: ${fecha} | Ministerio: ${ministerioSeleccionado} | Total: ${datos.length} servidores`;

  worksheet.addRow([]);
  worksheet.addRow([]);
  worksheet.addRow([]);

  const encabezados = [
    "Ministerio",
    "Nombre",
    "Cargo",
    "Teléfono",
    "Academia",
    "Otro ministerio",
    "Estado"
  ];

  const headerRow = worksheet.addRow(encabezados);

  headerRow.eachCell((cell) => {

    cell.font = {
      bold: true,
      color: { argb: "FFFFFFFF" }
    };

    cell.fill = {
      type: "pattern",
      pattern: "solid",
      fgColor: {
        argb: "FF1E40AF"
      }
    };

    cell.alignment = {
      horizontal: "center",
      vertical: "middle"
    };

  });

  datos.forEach((servidor) => {

    worksheet.addRow([
      servidor.ministerioPrincipal || "",
      servidor.nombre || "",
      servidor.cargo || "",
      servidor.telefono || "",
      servidor.academia || "",
      servidor.otrosMinisterios || "",
      servidor.estado || ""
    ]);

  });

  worksheet.columns = [
    { width: 32 },
    { width: 35 },
    { width: 15 },
    { width: 15 },
    { width: 15 },
    { width: 45 },
    { width: 12 }
  ];

  worksheet.autoFilter = {
    from: "A7",
    to: "G7"
  };

  worksheet.views = [
    {
      state: "frozen",
      ySplit: 7
    }
  ];

  const buffer =
    await workbook.xlsx.writeBuffer();

  saveAs(
    new Blob([buffer]),
    `Servidores_Iglesia_La_RED_${fechaArchivo}.xlsx`
  );

});

btnPDF.addEventListener("click", () => {
  const datos = obtenerServidoresFiltrados();
  const { jsPDF } = window.jspdf;

  const doc = new jsPDF("landscape", "mm", "letter");

  const fecha = new Date().toLocaleDateString("es-SV", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

  const ministerioSeleccionado =
    filtroMinisterio.value || "Todos los ministerios";

  const logo = new Image();
  logo.src = "logo-red-oficial.png";

  logo.onload = () => {
    doc.addImage(logo, "PNG", 15, 10, 45, 25);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.setTextColor(30, 64, 175);
    doc.text("IGLESIA LA RED", 70, 18);

    doc.setFontSize(13);
    doc.setTextColor(30, 41, 59);
    doc.text("Listado de Ministerios y Servidores", 70, 27);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(`Fecha: ${fecha}`, 70, 35);
    doc.text(`Ministerio: ${ministerioSeleccionado}`, 120, 35);
    doc.text(`Total: ${datos.length} servidores`, 220, 35);

    const filas = datos.map((servidor) => [
      servidor.ministerioPrincipal || "",
      servidor.nombre || "",
      servidor.cargo || "",
      servidor.telefono || "",
      servidor.academia || "",
      servidor.otrosMinisterios || "",
      servidor.estado || ""
    ]);

    doc.autoTable({
      startY: 45,
      head: [[
        "Ministerio",
        "Nombre",
        "Cargo",
        "Teléfono",
        "Academia",
        "Otro ministerio",
        "Estado"
      ]],
      body: filas,
      styles: {
        fontSize: 7,
        cellPadding: 2,
        valign: "middle"
      },
      headStyles: {
        fillColor: [30, 64, 175],
        textColor: 255,
        fontStyle: "bold"
      },
      alternateRowStyles: {
        fillColor: [241, 245, 249]
      },
      margin: {
        left: 10,
        right: 10
      },
      didDrawPage: function () {
        const pageHeight = doc.internal.pageSize.height;
        const pageWidth = doc.internal.pageSize.width;

        doc.setFontSize(8);
        doc.setTextColor(100);

        doc.text(
          "Iglesia La RED · Donde Todos Cabemos · Mi Casa / Tu Casa",
          10,
          pageHeight - 8
        );

        doc.text(
          `Página ${doc.internal.getNumberOfPages()}`,
          pageWidth - 30,
          pageHeight - 8
        );
      }
    });

    const fechaArchivo = new Date().toISOString().split("T")[0];

    doc.save(`Servidores_Iglesia_La_RED_${fechaArchivo}.pdf`);
  };
});
    
busqueda.addEventListener("input", aplicarFiltros);
filtroMinisterio.addEventListener("change", aplicarFiltros);

    onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "/";
    return;
  }

  cargarServidores();
});
  </script>
    
</body>
</html>
