    .localeCompare(
      b.nombre || "",

function calcularEdad(servidor) {
  const fechaNacimiento =
    servidor.fechaNacimiento ||
    servidor.fecha_nacimiento ||
    servidor.nacimiento ||
    servidor.fechaDeNacimiento;

  if (!fechaNacimiento) {
    return "";
  }

  let nacimiento;

  // Firestore Timestamp
  if (typeof fechaNacimiento.toDate === "function") {
    nacimiento = fechaNacimiento.toDate();
  }

  // Timestamp convertido en objeto
  else if (fechaNacimiento.seconds) {
    nacimiento = new Date(fechaNacimiento.seconds * 1000);
  }

  // Fecha guardada como texto o Date
  else {
    nacimiento = new Date(fechaNacimiento);
  }

  if (Number.isNaN(nacimiento.getTime())) {
    return "";
  }

  const hoy = new Date();

  let edad = hoy.getFullYear() - nacimiento.getFullYear();

  const yaCumplio =
    hoy.getMonth() > nacimiento.getMonth() ||
    (
      hoy.getMonth() === nacimiento.getMonth() &&
      hoy.getDate() >= nacimiento.getDate()
    );

  if (!yaCumplio) {
    edad--;
  }

  return edad >= 0 && edad <= 120 ? edad : "";
}

function formatearCumpleanos(servidor) {

  const fechaNacimiento =
    servidor.fechaNacimiento ||
    servidor.fecha_nacimiento ||
    servidor.nacimiento ||
    servidor.fechaDeNacimiento;

  if (!fechaNacimiento) {
    return "—";
  }

  let mes;
  let dia;

  // Firestore Timestamp
  if (
    fechaNacimiento &&
    typeof fechaNacimiento.toDate === "function"
  ) {
    const fecha = fechaNacimiento.toDate();

    mes = fecha.getMonth();
    dia = fecha.getDate();
  }

  // Timestamp convertido en objeto
  else if (
    fechaNacimiento &&
    fechaNacimiento.seconds
  ) {
    const fecha =
      new Date(
        fechaNacimiento.seconds * 1000
      );

    mes = fecha.getMonth();
    dia = fecha.getDate();
  }

  // Texto YYYY-MM-DD
  else if (
    typeof fechaNacimiento === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(fechaNacimiento)
  ) {
    const partes =
      fechaNacimiento.split("-");

    mes = Number(partes[1]) - 1;
    dia = Number(partes[2]);
  }

  // Otros formatos válidos
  else {
    const fecha =
      new Date(fechaNacimiento);

    if (Number.isNaN(fecha.getTime())) {
      return "—";
    }

    mes = fecha.getMonth();
    dia = fecha.getDate();
  }

  const meses = [
    "enero",
    "febrero",
    "marzo",
    "abril",
    "mayo",
    "junio",
    "julio",
    "agosto",
    "septiembre",
    "octubre",
    "noviembre",
    "diciembre"
  ];

  if (
    mes < 0 ||
    mes > 11 ||
    !dia
  ) {
    return "—";
  }

  return `🎂 ${dia} de ${meses[mes]}`;
}

// ======================================================
// NORMALITARS™ — NOMBRES OFICIALES DE MINISTERIOS
// ======================================================

function normalizarNombreMinisterio(valor) {

  const original =
    String(valor || "").trim();

  if (!original) {
    return "Sin ministerio";
  }

  const clave = original
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();

  const equivalencias = {

    // La Red Kids
    "la red kids":
      "Ministerio La Red Kids",

    "ministerio la red kids":
      "Ministerio La Red Kids",

    // Comunicaciones
    "ministerio de comunicacione":
      "Ministerio de Comunicaciones",

    "ministerio de comunicaciones":
      "Ministerio de Comunicaciones",

    // Sin ministerio
    "sin ministerio":
      "Sin ministerio",

    // Cocina
    "ministerio de ministerio de cocina":
      "Ministerio de Cocina",

    "ministerio de cocina":
      "Ministerio de Cocina"

  };

  return equivalencias[clave] || original;
}
    
    function normalizarMinisterio(texto) {
      return (texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replaceAll("ministerio de ", "")
        .replaceAll("ministerio ", "")
        .replaceAll("(lider)", "")
        .replaceAll("(servidor)", "")
        .replaceAll("lider", "")
        .replaceAll("servidor", "")
        .replaceAll("líder", "lider")
        .replaceAll("diácono", "")
        .replaceAll("diacono", "")
        .replaceAll("|", " ")
        .replaceAll(",", " ")
        .replaceAll("/", " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function obtenerServidoresFiltrados() {
      const texto = busqueda.value.toLowerCase().trim();
      const ministerioSeleccionado = filtroMinisterio.value;

      return servidores.filter((servidor) => {
        const coincideTexto = `
          ${servidor.ministerioPrincipal || ""}
          ${servidor.nombre || ""}
          ${servidor.cargo || ""}
          ${servidor.telefono || ""}
          ${servidor.academia || ""}
          ${servidor.otrosMinisterios || ""}
          ${servidor.estado || ""}
        `.toLowerCase().includes(texto);

        const textoMinisteriosServidor = normalizarMinisterio(`
          ${servidor.ministerioPrincipal || ""}
          ${servidor.otrosMinisterios || ""}
          ${servidor.ministerios || ""}
        `);

        const ministerioFiltro = normalizarMinisterio(ministerioSeleccionado);

        const coincideMinisterio =
          ministerioSeleccionado === "" ||
          textoMinisteriosServidor.includes(ministerioFiltro);

        return coincideTexto && coincideMinisterio;
      });
    }

    calcularEdad(servidor) || "",
    formatearCumpleanos(servidor).replace("🎂 ", ""),
    servidor.telefono || "",
    servidor.academia || "",
    servidor.otrosMinisterios || "",
    servidor.estado || ""
  ]);
});

worksheet.columns = [
  { width: 32 }, // Ministerio
  { width: 35 }, // Nombre
  { width: 15 }, // Cargo
  { width: 9 },  // Edad
  { width: 18 }, // Cumpleaños
  { width: 15 }, // Teléfono
  { width: 15 }, // Academia
  { width: 45 }, // Otro ministerio
  { width: 12 }  // Estado
];

      worksheet.autoFilter = {
        from: "A7",
        to: "I7"
      };

      worksheet.views = [
        {
          state: "frozen",
          ySplit: 7
        }
      ];

      const buffer = await workbook.xlsx.writeBuffer();

      saveAs(
        new Blob([buffer]),
        `Servidores_Iglesia_La_RED_${fechaArchivo}.xlsx`
      );
    });

    btnPDF.addEventListener("click", () => {
      const datos = obtenerServidoresFiltrados();
      const { jsPDF } = window.jspdf;

      const doc = new jsPDF("landscape", "mm", "letter");

      const fecha = new Date().toLocaleDateString("es-SV", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });

      const ministerioSeleccionado = filtroMinisterio.value || "Todos los ministerios";

      const logo = new Image();
      logo.src = "logo-red-oficial.png";

      logo.onload = () => {
        doc.addImage(logo, "PNG", 15, 10, 45, 25);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.setTextColor(30, 64, 175);
        doc.text("IGLESIA LA RED", 70, 18);

        doc.setFontSize(13);
        doc.setTextColor(30, 41, 59);
        doc.text("Listado de Ministerios y Servidores", 70, 27);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(`Fecha: ${fecha}`, 70, 35);
        doc.text(`Ministerio: ${ministerioSeleccionado}`, 120, 35);
        doc.text(`Total: ${datos.length} servidores`, 220, 35);

        const filas = datos.map((servidor) => [
        servidor.ministerioPrincipal || "",
        servidor.nombre || "",
        servidor.cargo || "",
        calcularEdad(servidor) || "",
        formatearCumpleanos(servidor).replace("🎂 ", ""),
        servidor.telefono || "",
        servidor.academia || "",
        servidor.otrosMinisterios || "",
        servidor.estado || ""
      ]);

        doc.autoTable({
          startY: 45,
      head: [[
      "Ministerio",
      "Nombre",
      "Cargo",
      "Edad",
      "Cumpleaños",
      "Teléfono",
      "Academia",
      "Otro ministerio",
      "Estado"
    ]],
          body: filas,
          styles: {
            fontSize: 7,
            cellPadding: 2,
            valign: "middle"
          },
          headStyles: {
            fillColor: [30, 64, 175],
            textColor: 255,
            fontStyle: "bold"
          },
          alternateRowStyles: {
            fillColor: [241, 245, 249]
          },
          margin: {
            left: 10,
            right: 10
          },
          didDrawPage: function () {
            const pageHeight = doc.internal.pageSize.height;
            const pageWidth = doc.internal.pageSize.width;

            doc.setFontSize(8);
            doc.setTextColor(100);

            doc.text(
              "Iglesia La RED · Donde Todos Cabemos · Mi Casa / Tu Casa",
              10,
              pageHeight - 8
            );

            doc.text(
              `Página ${doc.internal.getNumberOfPages()}`,
              pageWidth - 30,
              pageHeight - 8
            );
          }
        });

        const fechaArchivo = new Date().toISOString().split("T")[0];
        doc.save(`Servidores_Iglesia_La_RED_${fechaArchivo}.pdf`);
      };
    });

    busqueda.addEventListener("input", aplicarFiltros);
    filtroMinisterio.addEventListener("change", aplicarFiltros);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "/";
        return;
      }

      cargarServidores();
    });
  </script>

</body>
</html>
